    identity: register-name
    identity_source: register-name
    devices_sample:
    - BunkerHill BMD
    - Bunkerhill AVC
    - Bunkerhill Abdominal Aortic Quantification (AAQ)
    - Bunkerhill Contrast AVC
    - Bunkerhill Contrast CAC
    certified_products:
    - product: FDA-authorized AI-enabled device (Cardiovascular)
      panel: Cardiovascular
      lapsed: false
      latest_authorization: '2025-09-19'
    - product: FDA-authorized AI-enabled device (Radiology)
      panel: Radiology
      lapsed: false
      latest_authorization: '2026-03-06'
