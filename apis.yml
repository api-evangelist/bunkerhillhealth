aid: bunkerhillhealth
name: Bunkerhill Health
description: >-
  Bunkerhill Health is a healthcare AI company building Carebricks, a platform
  that lets clinical and operational teams at health systems build, deploy, and
  scale AI agents that reason across large volumes of patient and operational
  data and take real action across patient access, pharmacy, revenue cycle, care
  coordination, imaging, population health, and administrative workflows. The
  company also develops FDA-cleared imaging algorithms, such as opportunistic
  bone-mineral-density screening on routine abdominal CT. Backed by Felicis,
  Bunkerhill Health raised $55M to put AI agents to work inside hospitals. This
  API Evangelist profile currently tracks the company's public web presence; no
  public developer API, documentation, or specification surface has been
  published yet.
